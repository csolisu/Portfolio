        @keyframes fadeIn {

        .gallery-grid.centered-grid {

    <script src="../js/main.js"></script>
    <script>
        function switchTab(btn, galleryId) {
            // Ocultar todas las secciones
            document.getElementById('gallery-personales').style.display = 'none';
            document.getElementById('gallery-santa-natura').style.display = 'none';
            
            // Mostrar la sección seleccionada
            document.getElementById('gallery-' + galleryId).style.display = 'block';
            
            // Quitar clase activa a los botones
            const buttons = document.querySelectorAll('.gallery-tab-btn');
            buttons.forEach(b => b.classList.remove('active'));
            
            // Añadir clase activa al botón presionado
            btn.classList.add('active');
        }
    </script>
