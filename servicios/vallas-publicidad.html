    <style>
        .gallery-tabs-container {

        .gallery-tab-btn {

            font-family: var(--font-body);

        .gallery-tab-btn.active {

        }
        .gallery-section-title {
            display: none;
        }
        .gallery-section {
            margin-top: 0 !important;
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    
        @media (max-width: 768px) {
            .gallery-tabs-container {
                flex-wrap: wrap !important;
                gap: 10px !important;
                padding: 0 15px !important;
                margin: 20px auto !important;

    <script>
        function switchTab(btn, galleryId) {
            // Ocultar todas las secciones
            document.getElementById('gallery-personal').style.display = 'none';
            document.getElementById('gallery-irreverentes').style.display = 'none';
            
            // Mostrar la sección seleccionada
            document.getElementById('gallery-' + galleryId).style.display = 'block';
            
            // Quitar clase activa a los botones
            const buttons = document.querySelectorAll('.gallery-tab-btn');
            buttons.forEach(b => b.classList.remove('active'));
            
            // Añadir clase activa al botón presionado
            btn.classList.add('active');
        }
    </script>
