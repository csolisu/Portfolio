        .gallery-tabs-container {
            display: flex;
            justify-content: center;

        .gallery-tab-btn {

            padding: 12px 24px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .gallery-tab-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background-color: rgba(242, 73, 73, 0.05);
        }
        .gallery-tab-btn.active {
            background-color: var(--accent);
            border-color: var(--accent);
            color: #F2DCC2;
            font-weight: 700;
        }
        /* Ocultar el título interno de la galería ya que el botón sirve de título */
        .gallery-section-title {
            display: none;
        }
        /* Animación suave de aparición */
        .gallery-section {
            margin-top: 0 !important;
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

    <script>
        function switchTab(btn, galleryId) {
            // Ocultar todas las secciones
            document.getElementById('gallery-lefs').style.display = 'none';
            document.getElementById('gallery-corlad').style.display = 'none';
            
            // Mostrar la sección seleccionada
            document.getElementById('gallery-' + galleryId).style.display = 'block';
            
            // Quitar clase activa a los botones
            const buttons = document.querySelectorAll('.gallery-tab-btn');
            buttons.forEach(b => b.classList.remove('active'));
            
            // Añadir clase activa al botón presionado
            btn.classList.add('active');
        }
    </script>
